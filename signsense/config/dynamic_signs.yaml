dynamic_signs:
  J:
    detector:
      i_hold_frames: 6
      down_threshold: 0.06
      finish_hold_frames: 8
      phase_timeout: 70
    training:
      sequence_length: 120
      batch_size: 8
      epochs: 50
      learning_rate: 0.001
      hidden_size: 128
    stages:
      0: "Step 1/3 — Hold I (pinky up)"
      1: "Step 2/3 — Hook pinky DOWN"
      2: "Step 3/3 — Palm away, hold I"

  Z:
    detector:
      diagonal_threshold: 0.12
      horizontal_threshold: 0.08
      phase_timeout: 90
    training:
      sequence_length: 150
      batch_size: 10
      epochs: 60
      learning_rate: 0.0012
      hidden_size: 128
    stages:
      0: "Step 1/4 — Start position"
      1: "Step 2/4 — Horizontal stroke"
      2: "Step 3/4 — Diagonal stroke"
      3: "Step 4/4 — End position"

# SignSense Dynamic Signs Configuration
# Supports both complex (multi-stage) and simple (single-stage) gestures

dynamic_signs:
  # Simple gesture (single-stage motion) - record entire J motion as one sequence
  J:
    type: "simple"  # single-stage motion gesture
    description: "Letter J in ASL"
    training:
      sequence_length: 120
      batch_size: 8
      epochs: 50
      learning_rate: 0.001
      hidden_size: 128

  Z:
    type: "complex"
    description: "Letter Z in ASL"
    detector:
      diagonal_threshold: 0.12
      horizontal_threshold: 0.08
      phase_timeout: 90
    training:
      sequence_length: 150
      batch_size: 10
      epochs: 60
      learning_rate: 0.0012
      hidden_size: 128
    stages:
      0: "Step 1/4 — Start position"
      1: "Step 2/4 — Horizontal stroke"
      2: "Step 3/4 — Diagonal stroke"
      3: "Step 4/4 — End position"

# Gesture configurations (trainable models like J)
# Each gesture defines multi-stage motion patterns
HELLO:
  type: "complex"
  description: "Touch forehead, then move outward with smile"
  detector:
    stage_1_hold_frames: 5           # Hold 5 frames near face
    touch_forehead_threshold: 0.15   # Distance from forehead
    move_out_distance: 0.25          # Move hand outward
    stage_2_hold_frames: 6           # Hold final position
    phase_timeout: 60
  training:
    sequence_length: 80
    batch_size: 8
    epochs: 50
    learning_rate: 0.001
    hidden_size: 128
  stages:
    0: "Step 1/3 — Hand near face"
    1: "Step 2/3 — Touch forehead"
    2: "Step 3/3 — Move outward"

THANK_YOU:
  type: "complex"
  description: "Flat hand at chin, then move forward"
  detector:
    stage_1_hold_frames: 5
    chin_position_threshold: 0.15
    move_forward_distance: 0.25
    stage_2_hold_frames: 6
    phase_timeout: 60
  training:
    sequence_length: 80
    batch_size: 8
    epochs: 50
    learning_rate: 0.001
    hidden_size: 128
  stages:
    0: "Step 1/3 — Chin position"
    1: "Step 2/3 — Touch chin"
    2: "Step 3/3 — Move forward"

NAME:
  type: "complex"
  description: "N-handshape near cheek, slight movement"
  detector:
    stage_1_hold_frames: 4
    n_shape_threshold: 0.2
    cheek_proximity: 0.18
    stage_2_hold_frames: 6
    phase_timeout: 50
  training:
    sequence_length: 80
    batch_size: 8
    epochs: 50
    learning_rate: 0.001
    hidden_size: 128
  stages:
    0: "Step 1/3 — Prepare N-shape"
    1: "Step 2/3 — Near cheek"
    2: "Step 3/3 — Complete sign"

YES:
  type: "complex"
  description: "Thumb-up hand or head nod upward"
  detector:
    stage_1_hold_frames: 4
    thumb_up_threshold: 0.15
    nod_distance: 0.18
    stage_2_hold_frames: 6
    phase_timeout: 50
  training:
    sequence_length: 80
    batch_size: 8
    epochs: 50
    learning_rate: 0.001
    hidden_size: 128
  stages:
    0: "Step 1/3 — Ready position"
    1: "Step 2/3 — Upward motion"
    2: "Step 3/3 — Nod complete"

NO:
  type: "complex"
  description: "Index finger or head shake side-to-side"
  detector:
    stage_1_hold_frames: 4
    index_shape_threshold: 0.18
    shake_distance: 0.2
    stage_2_hold_frames: 6
    phase_timeout: 50
  training:
    sequence_length: 80
    batch_size: 8
    epochs: 50
    learning_rate: 0.001
    hidden_size: 128
  stages:
    0: "Step 1/3 — Ready position"
    1: "Step 2/3 — Side motion"
    2: "Step 3/3 — Shake complete"

# Custom gestures will be automatically added to this config
# when recording new gestures using the dynamic recorder
